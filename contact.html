<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Lodge Metalwork</title>
  <meta name="description" content="Get in touch with Lodge Metalwork by email, Instagram or Facebook to place an order or ask about a custom piece." />
  <meta name="theme-color" content="#171f26" />

  <link rel="icon" type="image/png" sizes="32x32" href="Images/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="Images/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="navbar"></div>

  <main id="main">
    <section class="contact-wrap">
      <div class="container">
        <div class="contact-card">
          <img class="brand-mark" src="Images/icons/mark-nav.png" alt="" width="279" height="240" />
          <span class="eyebrow">Get in touch</span>
          <h1>Let's talk metal</h1>
          <p>For orders, custom requests or just to say hello — email is the quickest way to reach me. You'll also find me on Instagram and Facebook.</p>

          <div class="contact-links">
            <a class="contact-link" href="mailto:lodgemetalwork@gmail.com">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
              <span>Email<small>lodgemetalwork@gmail.com</small></span>
            </a>
            <a class="contact-link" href="https://www.instagram.com/lodgemetalwork/?utm_source=ig_web_button_share_sheet" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
              <span>Instagram<small>@lodgemetalwork</small></span>
            </a>
            <a class="contact-link" href="https://www.facebook.com/profile.php?id=61573012455399" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 8h-2a2 2 0 0 0-2 2v2H9v3h2v6h3v-6h2.2l.8-3H14v-1.5a.5.5 0 0 1 .5-.5H16z"/></svg>
              <span>Facebook<small>Lodge Metal Work</small></span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="main.js" defer></script>
</body>
</html>
